<!DOCTYPE html>
<html>
<head>
    <title>Toko Fitri 💙</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div><b>💙 Toko Fitri</b></div>
    <div>
        <a href="#">Beranda</a>
        <a href="#">Produk</a>
        <a href="#">Kategori</a>
        <a href="#">Promo</a>
        <a href="login.html">Login</a>
    </div>
</div>

<!-- HERO -->
<div class="hero">
    <h1>Toko Fitri 💙</h1>
    <p>Belanja mudah, hati senang!</p>
</div>

<!-- FITUR -->
<div class="fitur">
    <div>🚚 Gratis Ongkir</div>
    <div>✔️ Produk Original</div>
    <div>🎧 24 Jam</div>
    <div>🔥 Promo Menarik</div>
</div>

<!-- PRODUK -->
<div class="container">

<div class="produk">
    <img src="https://via.placeholder.com/200">
    <h3>Skincare Blue</h3>
    <p>Rp65.000</p>
    <button onclick="tambah('Skincare')">Tambah</button>
</div>

<div class="produk">
    <img src="https://via.placeholder.com/200">
    <h3>Cushion Blue</h3>
    <p>Rp85.000</p>
    <button onclick="tambah('Cushion')">Tambah</button>
</div>

<div class="produk">
    <img src="https://via.placeholder.com/200">
    <h3>Parfum Blue</h3>
    <p>Rp75.000</p>
    <button onclick="tambah('Parfum')">Tambah</button>
</div>

<div class="produk">
    <img src="https://via.placeholder.com/200">
    <h3>Tas Cute</h3>
    <p>Rp55.000</p>
    <button onclick="tambah('Tas')">Tambah</button>
</div>

</div>

<!-- CART -->
<div class="cart">
    <h3>🛒 Keranjang</h3>
    <ul id="list"></ul>
</div>

<script>
function tambah(nama) {
    let list = document.getElementById("list");
    let item = document.createElement("li");
    item.innerText = nama;
    list.appendChild(item);
}
</script>

</body>
</html>
